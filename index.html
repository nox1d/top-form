<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>TOP Login Form - nox1d</title>
</head>
<body>
    <div id="main-div">
        <div class="container" id="sidebar">
            <div class="img-wrapper">
                <img id="leaf_background" alt="leaf_background" src="media/halie-west-25xggax4bSA-unsplash.jpg">
            </div>
            <div id="title">
                <img id="logo" alt="logo" src="media/odin-lined.png">
                <h1>ODIN</h1>
            </div>
            <span class="credit">
                <p>Photo by <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA" target="_blank">Halle West</a> on <a href="https://unsplash.com/" target="_blank">Unsplash</a></p>
            </span>
        </div>
        <div class="container" id="content">
            <div class="paragraph">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
                <p>Sign up <i>now</i> to get started.</p>
                <br>
                <p>You <i>know</i> you want to.</p>
            </div>

            <form>
                <div class="form-body">
                    <h3>Let's do this!</h3>
                    <div class="input-grid">
                        <div class="input-cell">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name">
                        </div>
                        <div class="input-cell">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name">
                        </div>
                        <div class="input-cell">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="input-cell">
                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        <div class="input-cell">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="input-cell">
                            <label for="password-confirm">CONFIRM PASSWORD</label>
                            <input type="password" id="password-confirm" name="password-confirm" required>
                        </div>
                    </div>
                </div>
                <div class="btn-wrapper">
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <a href="../login.html">Log in</a></p>
                </div>


            </form>
        </div>
    </div>
    
</body>
</html>
